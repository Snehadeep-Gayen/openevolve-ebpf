  {
    "overview": {
      "scope": "Synthetic UDP storage emulator with eBPF-aware load balancing (pebble-server) — only internal/, cmd/, scripts/, workload/, run.sh, run_exp.py included.",
      "languages": [
        "Go 1.22 (internal/*, cmd/*)",
        "Bash (run.sh, scripts/*, workload/run_client.sh)",
        "Python 3 (run_exp.py, scripts/dispatch_docker_experiments.py)"
      ],
      "artifact_conventions": {
        "logs": "logs/<role> (server|client)",
        "results": "results/run-* (per run.sh invocation) containing experiment.json + workload_summary.json",
        "eBPF_pin_paths": "/sys/fs/bpf/pebble/<RUN_ID> (set by run.sh before launching the Go server)"
      }
    },
    "execution_flow": [
      {
        "order": 1,
        "name": "Experiment orchestration",
        "artefact": "run_exp.py",
        "description": "Thin experiment wrapper: either shells into run.sh for fresh sweeps or parses dispatch manifests to summarise existing runs, then emits summary.json and optional matplotlib plots.",
        "key_steps": [
          "parse_args (run_exp.py:29-95) exposes policies/rates/threads plus manifest + plotting toggles.",
          "invoke_run_sh/load_manifest_runs gather `run-*` directories, extract metrics from workload_summary.json, and pass records into write_experiment_summary/generate_plots."
        ]
      },
      {
        "order": 2,
        "name": "Per-run workflow",
        "artefact": "run.sh",
        "description": "Convenience script that (a) slices NUMA CPUs between server/client, (b) rebuilds eBPF assets, (c) restarts the Go server for each workload iteration, (d) runs cmd/workload_client under taskset, and (e) aggregates iteration outputs into workload_summary.json.",
        "key_steps": [
          "resolve_cpu_pool/join_by (run.sh:27-118) derive SERVER_CPUSET + CLIENT_CPUSET from CPUSET_POOL or NUMA node 0.",
          "Calls scripts/build_ebpf.sh + scripts/cleanup_ebpf_maps.sh, then orchestrates server via scripts/launch_server.sh and client via run_client wrapper.",
          "Embedded Python (run.sh:415-452) regex-parses client logs into workload_summary.json; final line prints the run directory for downstream tooling."
        ]
      },
      {
        "order": 3,
        "name": "Runtime services",
        "artefacts": [
          "cmd/pebble_server/main.go:21-91 -> internal/server/*",
