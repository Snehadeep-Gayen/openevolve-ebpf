eval_agent_prompt: |-
  You are an expert in high-performance Linux UDP servers that load-balance traffic with SO_REUSEPORT and a custom sk_reuseport eBPF program. The traffic comes in as short GET requests and longer SCAN requests with 99.5% of the workload being GETs. Study the supplied artifacts (current eBPF implementation, run metrics, short codebase summary, performance summary, and performance explanation hypothesis.) to understand how the system actually behaved and why. From that understanding, produce a draft design document for a next-generation eBPF selector that improves on the observed problems. Additionally, be creative, trying new, potentially drastic different approaches, when you believe it will improve performance. Avoid speculation, note uncertainties, and assume reuseport slots, worker sockets, and database wiring are correctly configured in the application.

  Output strict JSON:
  {
    "status": "continue|finish",
    "design_doc": {
      "goals": ["clear goals tied to observed issues"],
      "evidence": ["key supporting observations from the hypothesis and performance summary"],
      "architecture": ["specific approach that should be taken by the eBPF program. Do not include code, only a text, design level idea/thought. Keep it to a few lines."],
      "risks": ["open questions or assumptions to verify from the codebase"]
    },
    "questions": ["<=5 precise, code-focused RAG queries needed to finalize the design"]
  }

  Guidelines:
  - Be precise, concise, and evidence-backed. Mark unknowns as uncertain.
  - Always use the simplest possible solution, unless necesarry to add more complexity to achieve the goal. For example, don't introduce state or a map unless its the only way to achieve the goal. Don't add complicated math or algorithms or branching unless its necesarry. 
  - For now, do not focus on fallbacks or error handling, nor logging to ensure correctness. 
  - Set `"status": "finish"` once you no longer need additional codebase information. Return `"continue"` only when you truly need RAG answers to refine the design.
  - Questions must target codebase details you cannot infer yet (e.g., "In workload/client.go, how many sender threads are spawned?"). The questions should be directly related to the codebase and not abstract. Never repeat answered questions or ask about artifacts already provided. For example, do not ask about the eBPF programs or logs that you already have access to and the RAG codebase knows nothing about.
  - For now, do not include code that requires any configuration in userspace. The eBPF program should be self-contained. You may include constant hyperparameters in the code, that you must tune yourself.
  - Do not worry about the selector logic. You only need to use AgentUDPSelector and can change state in the pebble_agent_state map, but may not create a new map. 

  Helpful Hints:
  - Now once you have solved the hash collision problem and get even distribution (assume the solution you come up with is correct), you then see a head of line blocking problem with the SCAN and GETs which inflate tail latency even though SCANs are only .05% of requests. Solve this problem now. 
  
code: |
  /*
   Pebble agent UDP reuseport selector (optimized, verifier-friendly)

   Approach:
   - Compute a single target slot from the 5-tuple hash provided in sk_reuseport_md.
   - Call bpf_sk_select_reuseport exactly once. The kernel will honor only the
     first call per packet in this hook, so any extra attempts are wasted work.
   - Fast path for power-of-two active sockets: use bitmask instead of modulo.
   - Clamp active to [1, 128] to stay within the sockarray bounds.
   - Fall back to SK_PASS when state is missing or inactive; kernel’s default
     hash-based selection remains in effect.

   Why this should improve performance:
   - Eliminates a fully unrolled 128-iteration loop and multiple conditional
     branches in the hot path, cutting instruction count and cycles per packet.
   - Reduces I-cache pressure and verifier/JIT complexity, which helps tail
     latency at high packet rates.
   - Keeps distribution stable by using the kernel-provided flow hash and
     selecting directly without retries.

   The program adheres to eBPF verifier constraints:
   - No unbounded loops; no stack-heavy constructs.
   - Single call to bpf_sk_select_reuseport.
   - Only uses data available in sk_reuseport_md and pinned maps.
  */

   //go:build ignore

  #include <linux/bpf.h>
  #include <bpf/bpf_helpers.h>

  struct {
      __uint(type, BPF_MAP_TYPE_REUSEPORT_SOCKARRAY);
      __uint(max_entries, 128);
      __type(key, __u32);
      __type(value, __u32);
      __uint(pinning, LIBBPF_PIN_BY_NAME);
  } pebble_udp_targets SEC(".maps");

  struct agent_state {
      __u32 active;
      __u32 pad;
  };

  struct {
      __uint(type, BPF_MAP_TYPE_ARRAY);
      __uint(max_entries, 1);
      __type(key, __u32);
      __type(value, struct agent_state);
      __uint(pinning, LIBBPF_PIN_BY_NAME);
  } pebble_agent_state SEC(".maps");

  /* EVOLVE-BLOCK-START
     Simplified, single-shot selection:
     - Use hash to compute slot directly.
     - Single helper call; no retry loop (kernel ignores subsequent calls anyway).
  */
  SEC("sk_reuseport/selector")
  enum sk_action agent_udp_selector(struct sk_reuseport_md *reuse)
  {
      __u32 key = 0;
      struct agent_state *st = bpf_map_lookup_elem(&pebble_agent_state, &key);
      if (!st)
          return SK_PASS;

      __u32 active = st->active;
      if (active == 0)
          return SK_PASS;
      if (active > 128)
          active = 128;

      __u32 slot;
      if ((active & (active - 1)) == 0) {
          // Power-of-two fast path
          slot = reuse->hash & (active - 1);
      } else {
          // General case
          slot = reuse->hash % active;
      }

      // Single selection attempt; if it fails, SK_PASS falls back to kernel default.
      bpf_sk_select_reuseport(reuse, &pebble_udp_targets, &slot, 0);
      return SK_PASS;
  }
  // EVOLVE-BLOCK-END

  char _license[] SEC("license") = "GPL";
